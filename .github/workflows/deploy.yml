name: CI/CD

on:
  push:
    branches: [main]
    tags: [ 'v*' ]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ryopc/koshi

jobs:
  # ============================================================================
  # Test job: linting and unit tests
  # ============================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

  # ============================================================================
  # Docker Build & Push job: native ARM runner + platform-split parallel build
  # ============================================================================
  docker:
    name: Build & Push Docker (${{ matrix.target }} / ${{ matrix.platform }})
    needs: test
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: standalone
            platform: linux/amd64
            runner: ubuntu-latest
          - target: standalone
            platform: linux/arm64
            runner: ubuntu-latest-arm64
          - target: runner
            platform: linux/amd64
            runner: ubuntu-latest
          - target: runner
            platform: linux/arm64
            runner: ubuntu-latest-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" == v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}-${{ steps.version.outputs.VERSION }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}-latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}" >> $GITHUB_OUTPUT
          fi

      - name: Build & push ${{ matrix.target }} (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.tags.outputs.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
          cache-from: |
            type=gha, mode=max
          cache-to: |
            type=gha, mode=max
