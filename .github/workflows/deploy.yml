name: CI/CD

on:
  push:
    branches: [main]
    tags: [ 'v*' ]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ryopc/koshi

jobs:
  # ============================================================================
  # Test job: linting and unit tests
  # ============================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --loglevel=error

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

  # ============================================================================
  # Docker Build & Push job
  # ============================================================================
  docker:
    name: Build & Push Docker (${{ matrix.target }} / ${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: standalone
            platform: linux/amd64
          - target: standalone
            platform: linux/arm64
          - target: runner
            platform: linux/amd64
          - target: runner
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" == v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Determine image tags
        id: tags
        run: |
          echo "IMAGE_TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}-${{ matrix.platform | replace('/', '-') }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}-${{ matrix.platform | replace('/', '-') }}-${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT

      - name: Build & push ${{ matrix.target }} (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.tags.outputs.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
          cache-from: |
            type=gha, mode=max
          cache-to: |
            type=gha, mode=max

  # ============================================================================
  # Manifest job: create multi-arch manifest lists
  # ============================================================================
  manifest:
    name: Create Multi-arch Manifests
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" == v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Create manifest for standalone
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone-${{ steps.version.outputs.VERSION }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone-latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone-linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone-linux-arm64

      - name: Create manifest for runner
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runner-${{ steps.version.outputs.VERSION }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runner-latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runner-linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runner-linux-arm64
