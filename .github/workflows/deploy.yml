name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ryopc/koshi

jobs:
  # ============================================================================
  # Test job: linting and unit tests
  # ============================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --loglevel=error
      - run: npm run lint
        continue-on-error: true
      - run: npm test
        continue-on-error: true

  # ============================================================================
  # Docker Build & Push job
  # ============================================================================
  docker:
    name: Build & Push Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target: [standalone, runner]
        platform: [linux/amd64]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Extract build version
        id: build_version
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" == v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi
      - name: Determine image tags
        id: tags
        run: |
          echo "IMAGE_TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}-${{ matrix.platform | replace('/', '-') }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}-${{ matrix.platform | replace('/', '-') }}-${{ steps.build_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
      - name: Build & push ${{ matrix.target }} (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.tags.outputs.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build_version.outputs.VERSION }}
          cache-from: |
            type=gha, mode=max
          cache-to: |
            type=gha, mode=max