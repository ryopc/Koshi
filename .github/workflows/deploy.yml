# License: MIT
# ============================================================================

name: CI/CD

on:
  push:
    branches: [main]
    tags: [ 'v*' ]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ryopc/koshi

jobs:
  # ============================================================================
  # Test job: linting and unit tests
  # ============================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --loglevel=error

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

  # ============================================================================
  # Docker Build & Push job
  # ============================================================================
  docker:
    name: Build & Push Docker (standalone / linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push standalone (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: standalone
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone-linux-amd64
          cache-from: type=gha, mode=max
          cache-to: type=gha, mode=max
