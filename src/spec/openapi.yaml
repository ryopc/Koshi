    get:
      tags: [Events]
      summary: Event stream (SSE or polling)
      operationId: getEvents
      parameters:
        - name: types
          in: query
          schema:
            type: string
          description: Comma-separated event types
        - name: since
          in: query
          schema:
            type: integer
          description: Resume from event ID (exclusive)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEEvent'
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentEvent'

  /subscriptions:
    get:
      tags: [Events]
      summary: List webhook subscriptions
      operationId: listSubscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'

    post:
      tags: [Events]
      summary: Create webhook subscription
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid input
        '409':
          description: Already subscribed

  /subscriptions/{id}:
    delete:
      tags: [Events]
      summary: Delete webhook subscription
      operationId: deleteSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found

